question_types:
  - id: mcq
    name: Multiple Choice
    description: Select one answer from a list of options
    requires_options: true
  - id: numeric
    name: Numeric Answer
    description: Enter a number
    requires_options: false
  - id: free_text
    name: Free Text
    description: Short written answer
    requires_options: false
  - id: multi_select
    name: Multi-Select
    description: Select all correct options
    requires_options: true
  - id: matching
    name: Matching
    description: Match pairs of items
    requires_options: true
  - id: ordering
    name: Ordering
    description: Order items into the correct sequence
    requires_options: true
  - id: cloze
    name: Cloze
    description: Fill in the blanks in a passage
    requires_options: false
  - id: image_choice
    name: Image Choice
    description: Select one image from a set of image options
    requires_options: true
  - id: creative_writing
    name: Creative Writing
    description: Extended written response to a prompt
    requires_options: false
  - id: unknown_custom
    name: Unknown / Custom
    description: Format not yet classified
    requires_options: false
